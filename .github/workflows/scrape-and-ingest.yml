name: Scrape and ingest grocery listings

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shelfwatch-scrape-and-ingest
  cancel-in-progress: false

jobs:
  scrape-and-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            scraper/requirements.txt
      - name: Require the hosted database secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add DATABASE_URL as a GitHub Actions secret before running the scraper."
            exit 1
          fi
      - name: Install scraper and storage dependencies
        run: python -m pip install -r requirements.txt -r scraper/requirements.txt
      - name: Install Chromium for Shwapno listings
        run: python -m playwright install --with-deps chromium
      - name: Collect product listings
        run: python scraper/main.py
      - name: Verify the collection produced data
        run: |
          if [ ! -s scraper/output/all_products_combined.csv ]; then
            echo "::error::The scraper produced no combined product snapshot; ingestion was not run."
            exit 1
          fi
      - name: Ingest the snapshot into Neon
        run: python -m src.storage.db
